[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asap-android"
version = "3.0.0"
description = "Android static analysis tool with APK workspaces and security reports"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jeongahn Jang"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]

[project.scripts]
asap = "asap.cli:main"

[tool.setuptools.packages.find]
include = ["asap*"]

[tool.setuptools.package-data]
asap = ["web/*.html", "web/*.css", "web/*.js", "guides/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
