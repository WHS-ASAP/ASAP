name: ASAP offline regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and local HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic source smoke test
        run: python -m asap scan tests/fixtures/demo -o results/ci --fail-on none --strict
      - name: Distribution consistency
        run: python scripts/check_distribution.py
